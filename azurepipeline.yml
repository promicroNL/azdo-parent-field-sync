# Synchronize selected fields from parent work items to child work items.
#
# Default example:
#   User Story.Custom.Process -> Task.Custom.Process
#
# Add more mappings to fieldMappings and Azure DevOps will generate one
# PowerShell step per field. Source and target may be the same field or
# different field reference names.

trigger: none
pr: none

schedules:
- cron: "*/30 * * * *"
  displayName: Every 30 minutes
  branches:
    include:
    - main
  always: true

parameters:
- name: parentWorkItemType
  displayName: Parent work item type
  type: string
  default: 'User Story'

- name: childWorkItemType
  displayName: Child work item type
  type: string
  default: 'Task'

- name: fieldMappings
  displayName: Fields to synchronize
  type: object
  default:
  - source: 'Custom.Process'
    target: 'Custom.Process'

  # Add more mappings like this:
  # - source: 'Custom.Customer'
  #   target: 'Custom.Customer'
  # - source: 'Custom.ReportingCategory'
  #   target: 'Custom.ReportingCategory'

pool:
  vmImage: 'windows-latest'

steps:
- checkout: self

- ${{ each mapping in parameters.fieldMappings }}:
  - task: PowerShell@2
    displayName: 'Sync ${{ mapping.source }} -> ${{ mapping.target }}'
    inputs:
      targetType: filePath
      filePath: '$(Build.SourcesDirectory)/scripts/Sync-ParentFieldToChildren.ps1'
      pwsh: true
      arguments: >
        -OrganizationUrl "$(System.CollectionUri)"
        -Project "$(System.TeamProject)"
        -SourceFieldReferenceName "${{ mapping.source }}"
        -TargetFieldReferenceName "${{ mapping.target }}"
        -ParentWorkItemType "${{ parameters.parentWorkItemType }}"
        -ChildWorkItemType "${{ parameters.childWorkItemType }}"
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
